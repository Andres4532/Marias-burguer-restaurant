services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurante-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: restaurante123
      POSTGRES_DB: restaurante_pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante -d restaurante_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
